method: searched
status: published
source: https://docs.aigateway.cequence.ai/docs/remote-mcp-servers/cequence-ai-gateway
ownership: >-
  First-party. The provider's own documentation states "This is the only remote MCP server in
  this section that Cequence operates. It is not a third-party vendor endpoint and requires no
  self-hosting." Every other server listed under /docs/remote-mcp-servers/ is a third-party
  vendor endpoint that the Cequence AI Gateway proxies, and is NOT catalogued here.
deployment:
  mode: remote
  endpoint: https://mcp.aigateway.cequence.ai/mcp
  auth: oauth
  verified: probed
  note: >-
    The raw endpoint is real and reachable — an unauthenticated POST of tools/list returns
    HTTP 401 {"message":"Missing or invalid Authorization header"}, and the host serves RFC
    9728 protected-resource metadata naming exactly this resource. The docs direct customers
    to connect to the PER-TENANT URL shown on the server's MCP details page rather than to
    the raw endpoint, because the server is provisioned automatically for every tenant. There
    is no stdio package for this server; @cequenceai/mcp-stdio (see packages/) is a generic
    stdio-to-HTTP bridge for reaching ANY Cequence-fronted MCP server from a stdio-only client.
server:
  name: Cequence AI Gateway MCP
  transport: http
  protocol: Streamable HTTP
  url: https://mcp.aigateway.cequence.ai/mcp
  hosted_by: Cequence
  provisioning: automatic — created for every tenant, available out of the box in the MCP Registry
  request_timeout_seconds: 30
authentication:
  type: oauth2
  required: true
  flow: authorization_code
  pkce: S256
  dynamic_client_registration: true
  registration_endpoint: https://mcp.aigateway.cequence.ai/register
  authorization_endpoint: https://mcp.aigateway.cequence.ai/authorize
  token_endpoint: https://mcp.aigateway.cequence.ai/token
  revocation_endpoint: https://mcp.aigateway.cequence.ai/revoke
  issuer: https://mcp.aigateway.cequence.ai
  identity_provider: Descope (the AI Gateway identity provider), proxied behind an RFC 8414 + RFC 9728 surface
  scopes: [openid, profile, email, descope.claims, descope.custom_claims]
  note: >-
    Permissions in the MCP server mirror the caller's portal role. Read tools work for any
    tenant member; write tools require an operator role (for example PlatformOperator or
    TenantUser) and otherwise return the same authorization error the UI returns.
