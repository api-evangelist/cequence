  "Cequence - The future of contracting" (cequence.io), an unrelated Scala shop. Cequence
  Security's own org is github.com/cequenceai. The packages are still first-party (author
  "Cequence Security", README "A command-line tool by Cequence Security", @cequenceai scope,
  and they configure Cequence AI Gateway endpoints), but the repository metadata points at a
  non-existent repo in another company's namespace and should be corrected by the provider.
