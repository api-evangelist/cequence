note: >-
  Registries probed 2026-09-05: npm, PyPI, crates.io, RubyGems, Maven Central, NuGet and
  pkg.go.dev. Only npm carries first-party Cequence Security packages, all under the
  @cequenceai scope, all authored "Cequence Security", all MIT. There is no server-side API
  client library in any language — Cequence publishes no OpenAPI for its control plane, so
  there is nothing for an SDK to wrap. What it ships instead is agent-client tooling: a CLI
  that wires an MCP server into an AI client, and a stdio bridge for clients that cannot speak
  HTTP MCP.
ownership_check: >-
